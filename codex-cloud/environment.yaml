schema_version: 1
name: "Codestra All-Repos Workstation"
platform: "Codex Cloud"
canonical_owner: "appolon1908"
control_repository: "appolon1908/Codestra-Workstation"
repository_count: 113
source_of_truth: ".codestra/repository-catalog.yaml"
selection:
  mode: "all-repositories"
  expected_owner: "appolon1908"
  expected_count: 113
workspace_policy:
  task_isolation: "one task, one primary repository unless cross-repo work is explicit"
  default_work_branch: "development"
  promotion_order: [development, testing, staging, production]
  respect_repository_AGENTS: true
  respect_branch_protection: true
  force_push_allowed: false
  production_effects_default: "deny"
  middleware_v3: "optional orchestration boundary, not a standalone runtime dependency"
  edge_path_when_applicable: "Caddy -> Kong -> Middleware :8095"
codex_cloud:
  internet_access_preset: "Package managers"
  publish_after_setup_validation: true
  bootstrap_script: "codex-cloud/bootstrap.sh"
  repo_skill: ".agents/skills/codestra-all-repos-workstation/SKILL.md"
repositories:
  - repository: "appolon1908/Frontend-Resturant-"
